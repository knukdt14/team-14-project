<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}TripRoll{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%96%EF%B8%8F%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="navbar">
  <div class="navbar-inner">
    <a class="brand" href="{{ url_for('pick.index') }}">🏖️ TripRoll</a>
    <ol class="stepper">
      <li class="{{ 'done' if trip_context.get('region') else '' }} {{ 'active' if active_step == 'pick' else '' }}">
        <a href="{{ url_for('pick.index') }}"><span class="step-num">1</span> 여행지</a>
      </li>
      <li class="{{ 'done' if trip_context.get('plan') else '' }} {{ 'active' if active_step == 'planner' else '' }}">
        <a href="{{ url_for('planner.index') }}"><span class="step-num">2</span> 일정</a>
      </li>
      <li class="{{ 'done' if trip_context.get('lodging') else '' }} {{ 'active' if active_step == 'lodging' else '' }}">
        <a href="{{ url_for('lodging.index') }}"><span class="step-num">3</span> 숙소</a>
      </li>
      <li class="{{ 'done' if trip_context.get('insurance') else '' }} {{ 'active' if active_step == 'insurance' else '' }}">
        <a href="{{ url_for('insurance.index') }}"><span class="step-num">4</span> 보험</a>
      </li>
    </ol>
  </div>
</header>
<main class="page">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
